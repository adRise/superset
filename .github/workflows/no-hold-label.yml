name: Hold Label Check

on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, synchronize]

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-hold-label:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        use-policy-store: true
        egress-policy: audit
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - name: Check for 'hold' label
      uses: actions/github-script@v7
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const payload = context.payload.pull_request
          const holdLabelPresent = !!payload.labels.find(label => label.name.includes('hold'))
          if (holdLabelPresent) {
            core.setFailed('Hold label is present, merge is blocked.')
          }
